name: Second session
# Work in progress on this fork only. On the project's unchanged main branch a second run of the
# browser suite in one folder sometimes loses three addresses under /api/projects/<id>/ (they
# answer with the not-found page), and three tests fail. Round 11, Linux, "suite, setup, build,
# suite": the second run failed in 4 of 6 jobs on main, in 0 of 8 when the test server starts the
# dev server without its saved state (branch smoke-cold-start), and in 1 of 6 when Playwright
# stops the test server with SIGTERM instead (branch smoke-clean-stop).
# Round 12 repeats the first two on Linux. On macOS, where two runs without the saved state were
# slow in round 11, it runs the suite with and without it on the same machine, in both orders.
# Started by hand now that it has answered (runs 37573676188 and 37574915909).
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  arm:
    name: ${{ matrix.arm }}-${{ matrix.try }}
    strategy:
      fail-fast: false
      matrix:
        arm: [main, cold-start]
        try: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - arm: main
            try: 5
          - arm: main
            try: 6
          - arm: main
            try: 7
          - arm: main
            try: 8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.arm == 'main' && 'main' || 'smoke-cold-start' }}
          fetch-depth: 2
      - name: The commit under test
        shell: bash
        run: |
          git log -1 --format='%H %s'
          echo "--- files this commit changes"
          git show --stat --format= HEAD | cut -c1-120
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Suite, setup, build, suite
        shell: bash
        run: |
          set +e
          tmpcount() { node -e "const fs=require('fs'),os=require('os');console.log(fs.readdirSync(os.tmpdir()).filter(n=>n.startsWith('video-fs-smoke-')).length)"; }
          port_answers() { node -e "const s=require('net').connect(3317,'localhost');s.on('connect',()=>{console.log('yes');process.exit(0)});s.on('error',()=>{console.log('no');process.exit(0)})"; }
          n=0
          for step in suite setup build suite; do
            n=$((n+1))
            echo "=== step $n: $step ($(date -u +%H:%M:%S) UTC)"
            case "$step" in
              suite)
                t0=$(date +%s)
                npx playwright test > "session-$n.log" 2>&1
                code=$?
                t1=$(date +%s)
                echo "RESULT step $n suite: exit $code; $(grep -E '^ +[0-9]+ (passed|failed|flaky|did not run)' "session-$n.log" | tr -s ' ' | tr '\n' ';')"
                echo "RESULT step $n suite: the whole command took $((t1-t0)) s"
                echo "RESULT step $n suite: lines saying 'Failed to find Server Action': $(grep -c 'Failed to find Server Action' "session-$n.log")"
                echo "RESULT step $n suite: lines saying 'discovery failed 404': $(grep -c 'discovery failed 404' "session-$n.log")"
                echo "RESULT step $n suite: folders named video-fs-smoke-* in the temp folder: $(tmpcount)"
                echo "RESULT step $n suite: something still answers on port 3317: $(port_answers)"
                if [ "$code" != "0" ]; then
                  echo "--- the tests that failed"
                  grep -E '^ +[0-9]+\) ' "session-$n.log" | cut -c1-170
                  echo "--- what each one expected and received"
                  grep -E 'Expected:|Received:|^ +> +[0-9]+ \||SyntaxError|Test timeout' "session-$n.log" | cut -c1-200 | head -40
                fi
                ;;
              setup)
                npm run setup
                ;;
              build)
                npm run build > "build-$n.log" 2>&1
                code=$?
                echo "RESULT step $n build: exit $code"
                echo "RESULT step $n build: lines in .next/dev/types/routes.d.ts: $(wc -l < .next/dev/types/routes.d.ts 2>/dev/null | tr -d ' ')"
                if [ "$code" != "0" ]; then
                  echo "--- the build's error lines"
                  grep -n -E 'error TS[0-9]+|Type error|Failed to compile|Build error|^Error' "build-$n.log" | cut -c1-200 | head -12
                  echo "--- .next/dev/types/routes.d.ts, its last 40 lines"
                  tail -n 40 .next/dev/types/routes.d.ts | cut -c1-170
                fi
                ;;
            esac
            echo "--- size of the dev server's saved state: $(du -sh .next/dev/cache 2>/dev/null | cut -f1)"
          done

  mac-pair:
    # The same machine runs the suite twice from an empty .next folder: once with the test server
    # as on main (saved state on) and once as on the branch (saved state off). Half the jobs run
    # one first, half the other, so a warm machine does not favour either.
    name: mac-${{ matrix.first }}-first-${{ matrix.try }}
    strategy:
      fail-fast: false
      matrix:
        first: [without-cache, with-cache]
        try: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smoke-cold-start
      - name: The commit under test
        run: git log -1 --format='%H %s'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The suite with and without the dev server's saved state
        shell: bash
        env:
          FIRST: ${{ matrix.first }}
        run: |
          set +e
          git fetch --quiet --depth=1 origin main
          run_suite() {
            label="$1"
            if [ "$label" = "with-cache" ]; then
              git checkout --quiet FETCH_HEAD -- next.config.ts scripts/smoke-server.mjs
            else
              git checkout --quiet HEAD -- next.config.ts scripts/smoke-server.mjs
            fi
            echo "files that differ from the branch for this run: $(git diff --name-only HEAD | wc -l | tr -d ' ')"
            rm -rf .next
            t0=$(date +%s)
            npx playwright test --reporter=list > "session-$label.log" 2>&1
            code=$?
            t1=$(date +%s)
            echo "RESULT $label: exit $code; $(grep -E '^ +[0-9]+ (passed|failed|flaky|did not run)' "session-$label.log" | tr -s ' ' | tr '\n' ';')"
            echo "RESULT $label: the whole command took $((t1-t0)) s"
            echo "RESULT $label: size of the dev server's saved state: $(du -sh .next/dev/cache 2>/dev/null | cut -f1)"
            echo "RESULT $label: lines saying 'Failed to find Server Action': $(grep -c 'Failed to find Server Action' "session-$label.log")"
            echo "--- each test and its time"
            grep -E 'tests/smoke/.*\([0-9.]+(ms|s|m)\)$' "session-$label.log" | sed -E 's/^ +([^ ]+) +[0-9]+ .*tests\/smoke\/([^ ]+) .*\(([0-9.]+[a-z]+)\)$/\1 \2 \3/' | cut -c1-90
            if [ "$code" != "0" ]; then
              echo "--- the tests that failed"
              grep -E '^ +[0-9]+\) ' "session-$label.log" | cut -c1-170
              echo "--- what each one expected and received"
              grep -E 'Expected:|Received:|^ +> +[0-9]+ \||SyntaxError|Test timeout' "session-$label.log" | cut -c1-200 | head -40
            fi
          }
          if [ "$FIRST" = "without-cache" ]; then order="without-cache with-cache"; else order="with-cache without-cache"; fi
          for label in $order; do
            echo "=== $label ($(date -u +%H:%M:%S) UTC)"
            run_suite "$label"
          done
