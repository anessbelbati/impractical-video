name: Fix probe
# Work in progress on this fork only. Runs every check separately and keeps going after a failure,
# so one run shows everything that still breaks on Windows and that nothing broke on Linux.
on:
  # Started by hand for a full pass; the Quick probe workflow answers single questions on a push.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-checks:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Line endings of the checkout
        shell: bash
        run: |
          git config --get core.autocrlf || echo "core.autocrlf unset"
          git ls-files --eol .env.example workflows/vertical-story-episode.md skills/storyboard-image-direction/SKILL.md app/globals.css tests/agent-binaries.test.ts public/fonts/font-atlas.json | cat
          echo "files checked out with CRLF outside opencut:"
          git ls-files --eol | grep -v "opencut/" | grep "w/crlf" | cat
          git status --short | head -20
      - name: Electron binary
        run: node node_modules/electron/install.js
      - name: The context hook, started the way Claude Code and Codex start it
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: node .github/probe/hook-probe.mjs
      - name: npm run lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: npm run typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: npm test (vitest)
        if: ${{ !cancelled() }}
        run: npm test
      - name: Desktop tests, one file at a time
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        run: |
          $summary = @()
          foreach ($file in (Get-ChildItem desktop -Filter *.test.mjs | Sort-Object Name)) {
            Write-Host "::group::$($file.Name)"
            $log = Join-Path $env:RUNNER_TEMP "$($file.BaseName).out"
            $process = Start-Process -FilePath node -ArgumentList @("--test", "--test-reporter=spec", "desktop/$($file.Name)") -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            $null = $process.Handle
            if ($process.WaitForExit(240000)) { $code = $process.ExitCode } else { taskkill /PID $process.Id /T /F | Out-Null; $code = "TIMEOUT after 240s" }
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content "$log.err" -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            $summary += "RESULT $($file.Name) exit=$code"
          }
          $summary | ForEach-Object { Write-Host $_ }
          if ($summary -match "exit=(?!0$)") { exit 1 }
      - name: The project's own command, npm run check
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npm run check
      - name: The concurrent-write test, 25 times
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          $failed = 0
          foreach ($round in 1..25) {
            $log = Join-Path $env:RUNNER_TEMP "write-$round.log"
            npx vitest run tests/workspace-check.test.ts *> $log
            if ($LASTEXITCODE -ne 0) { $failed++; "round $round failed"; Get-Content $log | Select-Object -Last 40 }
          }
          "concurrent-write test: $failed of 25 rounds failed"
          if ($failed -gt 0) { exit 1 }
      - name: npm run setup, then what the app reads back
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          npm run setup
          Select-String -Path .env.local -Pattern "^VIDEO_FS_DATA_ROOT=" | ForEach-Object { $_.Line }
          node -e "const nextEnv = require('@next/env'); const { parsedEnv } = nextEnv.loadEnvConfig(process.cwd(), true); const path = require('node:path'); const expected = path.join(process.cwd(), 'data', 'projects'); console.log('read back:', parsedEnv.VIDEO_FS_DATA_ROOT); console.log('expected :', expected); if (parsedEnv.VIDEO_FS_DATA_ROOT !== expected) process.exit(1);"
      - name: Launchers written by pnpm and Yarn
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        shell: pwsh
        run: |
          # Both go to folders that are not on the search path, so the app's own installers still run in the next step.
          $found = @()
          try {
            npm install -g pnpm 2>&1 | Select-Object -Last 2
            $env:PNPM_HOME = Join-Path $env:RUNNER_TEMP "pnpm-home"
            New-Item -ItemType Directory -Force (Join-Path $env:PNPM_HOME "bin") | Out-Null
            $env:Path = "$env:PNPM_HOME;$(Join-Path $env:PNPM_HOME 'bin');$env:Path"
            pnpm --version
            pnpm add -g @openai/codex @anthropic-ai/claude-code 2>&1 | Select-Object -Last 12
            "pnpm bin: $(pnpm bin -g)"
            $found += Get-ChildItem $env:PNPM_HOME, (Join-Path $env:PNPM_HOME "bin") -Filter *.cmd -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "^(codex|claude)\.cmd$" } | Select-Object -ExpandProperty FullName
          } catch { "pnpm part failed: $_" }
          try {
            # Yarn keeps the packages under %LOCALAPPDATA%; a prefix on another drive makes it write a launcher that cannot run.
            $yarnPrefix = Join-Path $env:LOCALAPPDATA "video-fs-probe-yarn"
            yarn --version
            "yarn global dir: $(yarn global dir)"
            yarn global add @openai/codex @anthropic-ai/claude-code --prefix $yarnPrefix 2>&1 | Select-Object -Last 12
            $found += Get-ChildItem (Join-Path $yarnPrefix "bin") -Filter *.cmd -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "^(codex|claude)\.cmd$" } | Select-Object -ExpandProperty FullName
          } catch { "yarn part failed: $_" }
          $found = $found | Select-Object -Unique
          "launchers found:"; $found
          "PROBE_LAUNCHERS=$($found -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Windows PowerShell started from PowerShell 7 through Node
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: pwsh
        run: node .github/probe/psmodulepath.mjs
      - name: The real installers and CLIs through the app's own code
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        shell: pwsh
        env:
          PROBE_REAL_AGENT_CLIS: "1"
        run: npx vitest run tests/real-agent-clis.probe.test.ts
      - name: What is still running after the cancel
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match "codex|claude" -or $_.CommandLine -match "codex|claude" } | Select-Object ProcessId, ParentProcessId, Name, @{ n = "CommandLine"; e = { if ($_.CommandLine.Length -gt 160) { $_.CommandLine.Substring(0, 160) } else { $_.CommandLine } } } | Format-Table -AutoSize -Wrap
          "browsers:"; Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue | Group-Object ProcessName | Select-Object Count, Name
      - name: What the real Codex loads from the hooks file the app writes
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node .github/probe/codex-hooks.mjs
      - name: What stops a folder from being moved on this system
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node .github/probe/folder-move.mjs
      - name: What a program started through PowerShell receives, byte for byte
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node .github/probe/powershell-pipes.mjs
      - name: The real Codex takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path (npm root -g) "@openai\codex\bin\codex.js"))) { npm install -g @openai/codex }
          node .github/probe/codex-runs-hooks.mjs
      - name: The real Claude Code takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path $HOME ".local\bin\claude.exe")) -and -not (Get-Command claude -ErrorAction SilentlyContinue)) { npm install -g @anthropic-ai/claude-code }
          node .github/probe/claude-runs-hooks.mjs
      - name: The real Codex once more with PowerShell 7 hidden, so that it falls back to Windows PowerShell
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        shell: powershell
        run: |
          Rename-Item "C:\Program Files\PowerShell\7" "7-hidden" -ErrorAction Stop
          try {
            $env:Path = ($env:Path -split ";" | Where-Object { $_ -and ($_ -notmatch '\\PowerShell\\7') }) -join ";"
            "pwsh on the search path now: $((Get-Command pwsh -ErrorAction SilentlyContinue).Source)"
            node .github/probe/codex-runs-hooks.mjs
          } finally {
            Rename-Item "C:\Program Files\PowerShell\7-hidden" "7"
          }
      - name: npm run doctor, with both CLIs now installed and FFmpeg still missing
        if: ${{ !cancelled() }}
        run: npm run doctor
      - name: The FFmpeg install command from doctor's hint
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          "before: ffmpeg $(if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { 'found' } else { 'not found' }), ffprobe $(if (Get-Command ffprobe -ErrorAction SilentlyContinue) { 'found' } else { 'not found' })"
          winget --version
          winget install Gyan.FFmpeg --accept-source-agreements --accept-package-agreements --disable-interactivity 2>&1 | Where-Object { $_ -match "[A-Za-z]{3}" } | Select-Object -Last 15
          "winget exit code: $LASTEXITCODE"
          $links = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Links"
          "links folder:"; Get-ChildItem $links -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          $programs = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Packages") -Recurse -Include ffmpeg.exe, ffprobe.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          "programs unpacked:"; $programs
          "user PATH entries added by winget:"; ([Environment]::GetEnvironmentVariable("Path", "User") -split ";") | Where-Object { $_ -match "WinGet" }
          # A new terminal would pick the folder up from the user's PATH; this job has to be told.
          if (Test-Path (Join-Path $links "ffmpeg.exe")) { $links | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          elseif ($programs) { Split-Path $programs[0] | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
      - name: npm run doctor, with FFmpeg installed
        if: ${{ !cancelled() }}
        run: npm run doctor
      - name: npm run release:scan
        if: ${{ !cancelled() }}
        run: npm run release:scan
      - name: The new delete test against the code from before the fix
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          git fetch --depth=1 origin f97dc4561ce7f13cee9338ef5c7336f0bdebf751
          git show f97dc4561ce7f13cee9338ef5c7336f0bdebf751:lib/workspace.ts > lib/workspace.ts
          npx vitest run tests/project-delete.test.ts && echo "RESULT: the delete test PASSES against the old code" || echo "RESULT: the delete test FAILS against the old code"
          git checkout -- lib/workspace.ts

  windows-without-git-bash:
    # Claude Code starts a hook through Git Bash when it finds one. This job hides Git for one
    # step to see what a machine without it does. Kept apart so that nothing else depends on it.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Electron binary
        run: node node_modules/electron/install.js
      - name: Claude Code from its own installer
        timeout-minutes: 10
        shell: powershell
        run: |
          try { irm https://claude.ai/install.ps1 | iex } catch { "the installer failed: $_" }
          if (-not (Test-Path (Join-Path $HOME ".local\bin\claude.exe"))) { npm install -g @anthropic-ai/claude-code }
      - name: The real Claude Code takes a prompt with Git hidden
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          Rename-Item "C:\Program Files\Git" "Git-hidden" -ErrorAction Stop
          try {
            $env:Path = ($env:Path -split ";" | Where-Object { $_ -and ($_ -notmatch '\\Git(\\|$)') }) -join ";"
            Remove-Item Env:CLAUDE_CODE_GIT_BASH_PATH -ErrorAction SilentlyContinue
            "git on the search path now: $((Get-Command git -ErrorAction SilentlyContinue).Source)"
            "bash on the search path now: $((Get-Command bash -ErrorAction SilentlyContinue).Source)"
            node .github/probe/claude-runs-hooks.mjs
          } finally {
            Rename-Item "C:\Program Files\Git-hidden" "Git"
          }

  macos-checks:
    # The system the project is developed on: its own checks, and the same probes of both agents.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Electron binary
        run: node node_modules/electron/install.js
      - name: npm run check
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: npm run check
      - name: The context hook, started the way Claude Code and Codex start it
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: node .github/probe/hook-probe.mjs
      - name: The real Codex takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          npm install -g @openai/codex
          node .github/probe/codex-hooks.mjs
          node .github/probe/codex-runs-hooks.mjs
      - name: The real Claude Code takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          npm install -g @anthropic-ai/claude-code
          node .github/probe/claude-runs-hooks.mjs
      - name: What stops a folder from being moved on this system
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node .github/probe/folder-move.mjs

  windows-app:
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: npm run test:smoke
        timeout-minutes: 20
        run: npm run test:smoke
      - name: Upload browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: npm run setup
        if: ${{ !cancelled() }}
        run: npm run setup
      - name: npm run build
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npm run build
      - name: The whole browser suite three more times
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: npx playwright test --repeat-each=3
      - name: The two browser tests that failed once on Windows, twelve times each
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: npx playwright test tests/smoke/local.spec.ts:3 tests/smoke/project-tour.spec.ts:90 --repeat-each=12

  linux-all:
    # The project's own CI steps. Its audit step fails on the unchanged main branch today,
    # so here every later step still runs.
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure Electron for Linux tests
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: What the real Codex loads from the hooks file the app writes
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          npm install -g @openai/codex
          node .github/probe/codex-hooks.mjs
      - name: The context hook, started the way Claude Code and Codex start it
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: xvfb-run --auto-servernum node .github/probe/hook-probe.mjs
      - name: The real Codex takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: xvfb-run --auto-servernum node .github/probe/codex-runs-hooks.mjs
      - name: The real Claude Code takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          npm install -g @anthropic-ai/claude-code
          xvfb-run --auto-servernum node .github/probe/claude-runs-hooks.mjs
      - name: What stops a folder from being moved on this system
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node .github/probe/folder-move.mjs
      - name: npm run check
        if: ${{ !cancelled() }}
        run: xvfb-run --auto-servernum npm run check
      - name: npm audit (fails on the unchanged main branch too)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: npm run release:scan
        if: ${{ !cancelled() }}
        run: npm run release:scan
      - name: Verify agent guide link
        if: ${{ !cancelled() }}
        run: test "$(readlink CLAUDE.md)" = AGENTS.md
      - name: npm run test:smoke
        if: ${{ !cancelled() }}
        run: npm run test:smoke
      - name: Upload browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: npm run setup
        if: ${{ !cancelled() }}
        run: npm run setup
      - name: What setup wrote for the data root
        if: ${{ !cancelled() }}
        run: grep '^VIDEO_FS_DATA_ROOT=' .env.local
      - name: npm run build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: npm run release:source
        if: ${{ !cancelled() }}
        run: npm run release:source
      - name: Verify exported agent guides and the line-ending rule
        if: ${{ !cancelled() }}
        run: |
          test ! -L dist/source/video-fs/CLAUDE.md && cmp AGENTS.md dist/source/video-fs/CLAUDE.md
          cmp .gitattributes dist/source/video-fs/.gitattributes
      - name: The whole browser suite three more times
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: npx playwright test --repeat-each=3
      - name: The browser test that fails on the project's own main branch, twelve times
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: npx playwright test tests/smoke/onboarding.spec.ts:31 --repeat-each=12
