name: Windows probe
# Runs the project's own checks on Windows and keeps going after a failure so one run shows everything that breaks.
# Lives only on work-in-progress branches of this fork.
on:
  workflow_dispatch:
  push:
    branches: ["wip/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Line endings of the checkout
        shell: bash
        run: |
          git config --get core.autocrlf || echo "core.autocrlf unset"
          git ls-files --eol workflows/vertical-story-episode.md skills/storyboard-image-direction/SKILL.md app/globals.css tests/agent-binaries.test.ts | cat
      - name: Platform facts
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node .github/probe/facts.mjs
      - name: Browser process started by the opener
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Start-Sleep -Seconds 6
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "example\.com" } | Select-Object -First 3 Name, CommandLine | Format-List
          Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Agent CLIs installed the usual ways
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        shell: pwsh
        run: |
          npm install -g @openai/codex @anthropic-ai/claude-code 2>&1 | Select-Object -Last 6
          $prefix = (npm prefix -g).Trim()
          "npm prefix: $prefix"
          Get-ChildItem $prefix -File | Select-Object -ExpandProperty Name
          "---- codex.cmd ----"; Get-Content (Join-Path $prefix "codex.cmd")
          "---- claude.cmd ----"; Get-Content (Join-Path $prefix "claude.cmd")
          "---- codex (sh stub, first lines) ----"; Get-Content (Join-Path $prefix "codex") -TotalCount 6
          "---- npm.cmd ----"; Get-Content (Get-Command npm.cmd).Source
          "---- versions ----"
          codex --version; "codex --version exit=$LASTEXITCODE"
          claude --version; "claude --version exit=$LASTEXITCODE"
          "---- codex exec --help ----"; codex exec --help 2>&1 | Select-Object -First 40
          "---- codex login status ----"; codex login status 2>&1 | Select-Object -First 10; "exit=$LASTEXITCODE"
          "---- claude auth status ----"; claude auth status 2>&1 | Select-Object -First 20; "exit=$LASTEXITCODE"
          "---- claude --help ----"; claude --help 2>&1 | Select-Object -First 70
          "---- native Claude installer ----"
          try { irm https://claude.ai/install.ps1 | iex } catch { "installer failed: $_" }
          Get-ChildItem (Join-Path $env:USERPROFILE ".local\bin") -ErrorAction SilentlyContinue | Select-Object Name, Length
          "---- package managers for the FFmpeg hint ----"
          try { winget --version; winget show --id Gyan.FFmpeg --accept-source-agreements 2>&1 | Select-Object -First 12 } catch { "winget unavailable: $_" }
      - name: npm run setup
        if: ${{ !cancelled() }}
        run: npm run setup
      - name: npm run doctor
        if: ${{ !cancelled() }}
        run: npm run doctor
      - name: npm run lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: npm run typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: npm test (vitest)
        if: ${{ !cancelled() }}
        run: npm test
      - name: Desktop tests, one file at a time
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        run: |
          $summary = @()
          foreach ($file in (Get-ChildItem desktop -Filter *.test.mjs | Sort-Object Name)) {
            Write-Host "::group::$($file.Name)"
            $log = Join-Path $env:RUNNER_TEMP "$($file.BaseName).out"
            $process = Start-Process -FilePath node -ArgumentList @("--test", "--test-reporter=spec", "desktop/$($file.Name)") -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            $null = $process.Handle
            if ($process.WaitForExit(240000)) { $code = $process.ExitCode } else { taskkill /PID $process.Id /T /F | Out-Null; $code = "TIMEOUT after 240s" }
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content "$log.err" -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            $summary += "RESULT $($file.Name) exit=$code"
          }
          $summary | ForEach-Object { Write-Host $_ }
          if ($summary -match "exit=(?!0$)") { exit 1 }
      - name: npm run release:scan
        if: ${{ !cancelled() }}
        run: npm run release:scan
      - name: Install Chromium for the smoke tests
        if: ${{ !cancelled() }}
        run: npx playwright install chromium
      - name: npm run test:smoke
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npm run test:smoke
      - name: npm run build
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npm run build
      - name: Upload browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
