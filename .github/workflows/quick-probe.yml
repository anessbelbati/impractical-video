name: Quick probe
# Work in progress on this fork only: the questions still open, each in a small job.
on:
  workflow_dispatch:
  push:
    branches: ["wip/**"]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  hooks-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Electron binary
        run: node node_modules/electron/install.js
      - name: The tests of what the app writes for the two agents
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node --test desktop/agent-setup.test.mjs desktop/codex-hook-compatibility.test.mjs
          npx vitest run tests/agent-onboarding-status.test.ts
      - name: Both agents, installed the way the app installs them
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        shell: powershell
        run: |
          npm install -g @openai/codex
          try { irm https://claude.ai/install.ps1 | iex } catch { "the installer failed: $_" }
          if (-not (Test-Path (Join-Path $HOME ".local\bin\claude.exe"))) { npm install -g @anthropic-ai/claude-code }
      - name: The real Codex takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: node .github/probe/codex-runs-hooks.mjs
      - name: The real Claude Code takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: node .github/probe/claude-runs-hooks.mjs
      - name: A Claude Code release from before hooks could list their arguments
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          $versions = npm view @anthropic-ai/claude-code versions --json | ConvertFrom-Json
          $old = $versions | Where-Object { $_ -match '^2\.1\.(\d+)$' -and [int]$Matches[1] -lt 139 } | Select-Object -Last 1
          "newest release below 2.1.139: $old"
          $prefix = Join-Path $env:RUNNER_TEMP "claude-old"
          npm install --prefix $prefix "@anthropic-ai/claude-code@$old" 2>&1 | Select-Object -Last 3
          $env:PROBE_CLAUDE = Join-Path $prefix "node_modules\.bin\claude.cmd"
          $env:PROBE_FIRST_CASE_ONLY = "1"
          node .github/probe/claude-runs-hooks.mjs

  hooks-windows-without-git-bash:
    # Claude Code starts a hook through Git Bash when it finds one. This job hides Git for one
    # step to see what a machine without it does. Kept apart so that nothing else depends on it.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Electron binary
        run: node node_modules/electron/install.js
      - name: Claude Code from its own installer
        timeout-minutes: 10
        shell: powershell
        run: |
          try { irm https://claude.ai/install.ps1 | iex } catch { "the installer failed: $_" }
          if (-not (Test-Path (Join-Path $HOME ".local\bin\claude.exe"))) { npm install -g @anthropic-ai/claude-code }
      - name: The real Claude Code takes a prompt with Git hidden
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          Rename-Item "C:\Program Files\Git" "Git-hidden" -ErrorAction Stop
          try {
            $env:Path = ($env:Path -split ";" | Where-Object { $_ -and ($_ -notmatch '\\Git(\\|$)') }) -join ";"
            Remove-Item Env:CLAUDE_CODE_GIT_BASH_PATH -ErrorAction SilentlyContinue
            "git on the search path now: $((Get-Command git -ErrorAction SilentlyContinue).Source)"
            "bash on the search path now: $((Get-Command bash -ErrorAction SilentlyContinue).Source)"
            node .github/probe/claude-runs-hooks.mjs
          } finally {
            Rename-Item "C:\Program Files\Git-hidden" "Git"
          }

  hooks-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Electron binary
        run: node node_modules/electron/install.js
      - name: npm run check
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: npm run check
      - name: The real Codex takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          npm install -g @openai/codex
          node .github/probe/codex-runs-hooks.mjs
      - name: The real Claude Code takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          npm install -g @anthropic-ai/claude-code
          node .github/probe/claude-runs-hooks.mjs

  hooks-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure Electron for Linux tests
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: The test of what the app writes for the two agents
        if: ${{ !cancelled() }}
        run: node --test desktop/agent-setup.test.mjs
      - name: The app's tool server with only the variables Codex hands an MCP server
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: xvfb-run --auto-servernum node .github/probe/tool-server-env.mjs
      - name: The real Codex takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          npm install -g @openai/codex
          xvfb-run --auto-servernum node .github/probe/codex-runs-hooks.mjs
      - name: The real Claude Code takes a prompt in a project the app prepared
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          npm install -g @anthropic-ai/claude-code
          xvfb-run --auto-servernum node .github/probe/claude-runs-hooks.mjs

  linux-suite:
    # The project's own CI steps with every change. The audit step is left out: it fails on the
    # unchanged main branch too, since advisories published after its last run.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure Electron for Linux tests
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: npm run check
        if: ${{ !cancelled() }}
        run: xvfb-run --auto-servernum npm run check
      - name: npm run release:scan
        if: ${{ !cancelled() }}
        run: npm run release:scan
      - name: Verify agent guide link
        if: ${{ !cancelled() }}
        run: test "$(readlink CLAUDE.md)" = AGENTS.md
      - name: npm run test:smoke
        if: ${{ !cancelled() }}
        run: npm run test:smoke
      - name: npm run setup
        if: ${{ !cancelled() }}
        run: npm run setup
      - name: npm run build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: npm run release:source
        if: ${{ !cancelled() }}
        run: npm run release:source
      - name: Verify exported agent guides
        if: ${{ !cancelled() }}
        run: test ! -L dist/source/video-fs/CLAUDE.md && cmp AGENTS.md dist/source/video-fs/CLAUDE.md

  browser-windows-after-build:
    # In an earlier round the project's fresh-install browser test failed twelve times out of
    # twelve on Windows, its upload answered with a 500. That step ran after "npm run setup" and
    # "npm run build" in the same folder. On a folder that had seen neither it passed six times
    # out of six. This repeats the earlier order one step at a time.
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: 1 - after npm run setup, their fresh-install test alone
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        shell: pwsh
        run: |
          npm run setup
          npx playwright test tests/smoke/local.spec.ts:3 --repeat-each=2
      - name: 2 - after npm run build as well, their fresh-install test alone
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        shell: pwsh
        run: |
          npm run build
          npx playwright test tests/smoke/local.spec.ts:3 --repeat-each=2
      - name: 3 - the upload probe
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: npx playwright test -c .github/probe/browser/playwright.config.ts
      - name: 4 - the whole suite
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npx playwright test
      - name: 5 - the two tests of the earlier round, three times each
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npx playwright test tests/smoke/local.spec.ts:3 tests/smoke/project-tour.spec.ts:90 --repeat-each=3

  clean-branch:
    # Each branch as it would be proposed, cut from the project's main branch, through the
    # project's own CI steps (the audit step left out, as above).
    strategy:
      fail-fast: false
      matrix:
        branch: [codex-hooks-file, setup-guide-reopen]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: The commit under test
        run: git log -1 --format='%H %s'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Electron binary
        run: node node_modules/electron/install.js
      - name: Linux only - browser and Electron sandbox
        if: ${{ runner.os == 'Linux' }}
        run: |
          npx playwright install --with-deps chromium
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: npm run check (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm run check
      - name: npm run check
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: npm run check
      - name: npm run release:scan
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: npm run release:scan
      - name: npm run test:smoke
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: npm run test:smoke
      - name: The setup-guide test twenty more times
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.branch == 'setup-guide-reopen' }}
        run: npx playwright test tests/smoke/onboarding.spec.ts:31 --repeat-each=20
      - name: npm run setup
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: npm run setup
      - name: npm run build
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: npm run build
      - name: npm run release:source
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: npm run release:source
      - name: Verify exported agent guides
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: test ! -L dist/source/video-fs/CLAUDE.md && cmp AGENTS.md dist/source/video-fs/CLAUDE.md
